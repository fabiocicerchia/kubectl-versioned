name: Publish Images

# Publishes one image tag per kubectl version listed in versions.txt
# (first line also gets :latest). Runs when versions.txt or the Dockerfile
# change on main, or on demand. Images go to GitHub Container Registry
# using the built-in GITHUB_TOKEN — no extra secrets required.
#
# Every pushed image is signed with cosign, keyless: the identity is this
# workflow's OIDC token and the signature lands in the public Rekor log, so
# there is no private key to rotate, leak or lose. An admission controller or
# an init container can then refuse anything that was not built here.

on:
  push:
    branches: [main]
    paths:
      - versions.txt
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      latest: ${{ steps.list.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Read versions.txt
        id: list
        run: |
          VERSIONS="$(grep -vE '^[[:space:]]*(#|$)' versions.txt \
            | jq -R . | jq -cs .)"
          LATEST="$(grep -vE '^[[:space:]]*(#|$)' versions.txt | head -n1)"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

  publish:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via OIDC
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          LATEST="${{ needs.versions.outputs.latest }}"
          TAGS="$IMAGE:${{ matrix.version }},$DOCKERHUB_IMAGE:${{ matrix.version }}"
          if [ "${{ matrix.version }}" = "$LATEST" ]; then
            TAGS="$TAGS,$IMAGE:latest,$DOCKERHUB_IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KUBECTL_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.tags }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # By digest, not by tag: signing `:latest` would sign whatever that tag
      # points at when this step runs, which is not necessarily what was just
      # built. Every tag in the push shares this digest, so one signature
      # covers all of them — but only within one registry. A signature is
      # stored as an artifact alongside the image it signs, so the Docker Hub
      # copy needs its own, even though it is the same digest.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"
