name: Publish Images

# Publishes one image tag per kubectl version listed in versions.txt
# (first line also gets :latest). Runs when versions.txt or the Dockerfile
# change on main, or on demand. Images go to GitHub Container Registry
# using the built-in GITHUB_TOKEN — no extra secrets required.

on:
  push:
    branches: [main]
    paths:
      - versions.txt
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      latest: ${{ steps.list.outputs.latest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read versions.txt
        id: list
        run: |
          VERSIONS="$(grep -vE '^[[:space:]]*(#|$)' versions.txt \
            | jq -R . | jq -cs .)"
          LATEST="$(grep -vE '^[[:space:]]*(#|$)' versions.txt | head -n1)"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

  publish:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          LATEST="${{ needs.versions.outputs.latest }}"
          TAGS="$IMAGE:${{ matrix.version }}"
          if [ "${{ matrix.version }}" = "$LATEST" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KUBECTL_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.tags }}
