name: Release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump (version.txt) + CHANGELOG. Merging
# that PR tags the release (vX.Y.Z) and publishes a GitHub Release.
#
# Docker images are published by publish.yml, triggered when versions.txt or
# the Dockerfile change — independently of the release cycle.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          release-type: simple # tracks version.txt + CHANGELOG.md
