# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: kubectl-versioned
  description: >-
      Every supported Kubernetes version as a tiny, distroless, multi-arch Docker image. One version = one
      tag. Nothing else inside.
  annotations:
    github.com/project-slug: fabiocicerchia/kubectl-versioned
    backstage.io/source-location: url:https://github.com/fabiocicerchia/kubectl-versioned/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/kubectl-versioned
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
